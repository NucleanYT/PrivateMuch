<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self'; img-src 'self' data:">
<title>PrivateMuch</title>
<link rel="stylesheet" href="chrome.css">
</head>
<body>
  <header class="bar" id="bar">
    <div class="group">
      <button class="icon" id="back" title="Back (Alt+Left)" aria-label="Back" disabled><svg viewBox="0 0 24 24"><path d="M15 5l-7 7 7 7"/></svg></button>
      <button class="icon" id="forward" title="Forward (Alt+Right)" aria-label="Forward" disabled><svg viewBox="0 0 24 24"><path d="M9 5l7 7-7 7"/></svg></button>
      <button class="icon" id="reload" title="Reload (F5)" aria-label="Reload"><svg viewBox="0 0 24 24"><path d="M19 12a7 7 0 1 1-2.05-4.95M19 4v4h-4"/></svg></button>
      <button class="icon" id="home" title="Home (Alt+Home)" aria-label="Home"><svg viewBox="0 0 24 24"><path d="M4 11.5 12 5l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></svg></button>
    </div>

    <form class="address" id="address" autocomplete="off">
      <span class="lock" id="lock" aria-hidden="true"></span>
      <input id="url" type="text" placeholder="Search or type a web address" aria-label="Search or type a web address"
             autocomplete="off" autocorrect="off" autocapitalize="off" spellcheck="false">
      <button type="button" class="icon small" id="clear" title="Clear" aria-label="Clear" hidden><svg viewBox="0 0 24 24"><path d="M7 7l10 10M17 7 7 17"/></svg></button>
    </form>

    <div class="group">
      <button class="icon" id="bookmark" title="Bookmarks" aria-label="Bookmarks"><svg viewBox="0 0 24 24"><path d="M7 4h10a1 1 0 0 1 1 1v15l-6-4.5L6 20V5a1 1 0 0 1 1-1Z"/></svg></button>
      <button class="tabs-count" id="tabs" title="Tabs" aria-label="Tabs">1</button>
      <button class="icon" id="newtab" title="New tab (Ctrl+T)" aria-label="New tab"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
      <button class="icon" id="settings" title="Settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M4 7h9M19 7h1M4 17h1M11 17h9M18 7a2 2 0 1 1-4 0 2 2 0 0 1 4 0ZM10 17a2 2 0 1 1-4 0 2 2 0 0 1 4 0Z"/></svg></button>
    </div>
    <div class="progress" id="progress"><i></i></div>
  </header>

  <section class="overlay" id="overlay" hidden></section>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>

  <script src="chrome.js"></script>
</body>
</html>
