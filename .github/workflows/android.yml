name: Build apps

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the page, Android app and Windows app share the same lists
        run: python3 .github/check_blocklist.py

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Test the Windows app's filter and storage
        working-directory: desktop
        run: node --test

  android:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PrivateMuch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: PrivateMuch.apk

  windows:
    needs: checks
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: desktop/package-lock.json

      - name: Install
        working-directory: desktop
        run: npm ci

      - name: Set the build number (the Update button compares it)
        working-directory: desktop
        run: npm version "1.0.${{ github.run_number }}" --no-git-tag-version --allow-same-version

      - name: Build the installer
        working-directory: desktop
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - name: Install the app (8 fresh installs) and check its window opens
        shell: pwsh
        run: ./.github/windows_smoke.ps1

      - name: Check the published build fails the button test (temporary)
        continue-on-error: true
        shell: pwsh
        run: |
          Invoke-WebRequest https://github.com/NucleanYT/PrivateMuch/releases/download/latest/PrivateMuch-Setup.exe -OutFile "$env:RUNNER_TEMP\old-setup.exe"
          Start-Process "$env:RUNNER_TEMP\old-setup.exe" -ArgumentList '/S' -Wait
          ./.github/windows_buttons.ps1
          Start-Process desktop/dist/PrivateMuch-Setup.exe -ArgumentList '/S' -Wait

      - name: Click the window buttons with the real mouse
        shell: pwsh
        run: ./.github/windows_buttons.ps1

      - name: Update over the running app, like Check for updates
        shell: pwsh
        run: ./.github/windows_update.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/dist/PrivateMuch-Setup.exe

  release:
    needs: [android, windows]
    # Android updates still go out if only the Windows build fails.
    if: ${{ !cancelled() && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: android

      - uses: actions/download-artifact@v4
        if: ${{ needs.windows.result == 'success' }}
        with:
          name: windows

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          files="PrivateMuch.apk"
          [ -f PrivateMuch-Setup.exe ] && files="$files PrivateMuch-Setup.exe"
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest $files \
            --target "$GITHUB_SHA" \
            --title "PrivateMuch build ${GITHUB_RUN_NUMBER}" \
            --notes "Android: download PrivateMuch.apk and open it on your phone. Windows: download PrivateMuch-Setup.exe and run it. Built from ${GITHUB_SHA::7}."
