name: Build Android app

on:
  push:
    branches: [main, 'claude/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-release
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check the page and app share the same lists
        run: python3 .github/check_blocklist.py

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon --stacktrace

      - name: Name the APK
        run: cp android/app/build/outputs/apk/release/app-release.apk PrivateMuch.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PrivateMuch
          path: PrivateMuch.apk

      - name: Publish to the "latest" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest PrivateMuch.apk \
            --target "$GITHUB_SHA" \
            --title "PrivateMuch build ${GITHUB_RUN_NUMBER}" \
            --notes "Download PrivateMuch.apk below and open it on your Android phone to install. Built from ${GITHUB_SHA::7}."
